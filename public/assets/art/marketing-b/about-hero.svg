<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 926" width="2200" height="926">
  <title>Northwind studio: abstract workspace (placeholder)</title>
  <rect width="2200" height="926" fill="#E4E4DC"/>
  <!-- window wall -->
  <g id="windows">
    <rect x="120" y="90" width="1960" height="470" rx="28" fill="#F3F1EC"/>
    <rect x="120" y="90" width="1960" height="470" rx="28" fill="none" stroke="#AEBFBD" stroke-width="6"/>
    <path d="M610 90v470M1100 90v470M1590 90v470M120 325h1960" stroke="#AEBFBD" stroke-width="6"/>
    <path d="M160 520c180-120 330-60 450-150s260-90 380-20 300 40 420-60 300-110 440-20 160 120 190 230" fill="none" stroke="#CFD7D4" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- long shared table -->
  <g id="table">
    <rect x="260" y="610" width="1680" height="54" rx="27" fill="#285D60"/>
    <rect x="360" y="664" width="22" height="220" fill="#203435"/>
    <rect x="1818" y="664" width="22" height="220" fill="#203435"/>
  </g>
  <!-- abstract seated figures: rounded geometric tokens, no faces -->
  <g id="figures">
    <g transform="translate(470 470)"><circle cx="60" cy="0" r="48" fill="#A5B287"/><rect x="0" y="62" width="120" height="140" rx="56" fill="#A5B287"/></g>
    <g transform="translate(780 450)"><circle cx="60" cy="0" r="48" fill="#C1BA95"/><rect x="0" y="62" width="120" height="160" rx="56" fill="#C1BA95"/></g>
    <g transform="translate(1100 470)"><circle cx="60" cy="0" r="48" fill="#889C98"/><rect x="0" y="62" width="120" height="140" rx="56" fill="#889C98"/></g>
    <g transform="translate(1420 455)"><circle cx="60" cy="0" r="48" fill="#516B66"/><rect x="0" y="62" width="120" height="155" rx="56" fill="#516B66"/></g>
  </g>
  <!-- laptops / notebooks on the table -->
  <g id="objects" fill="#FCFBFA">
    <rect x="520" y="566" width="140" height="44" rx="8"/>
    <rect x="830" y="566" width="140" height="44" rx="8"/>
    <rect x="1150" y="574" width="100" height="36" rx="6" fill="#CFD7D4"/>
    <rect x="1470" y="566" width="140" height="44" rx="8"/>
  </g>
  <!-- plant -->
  <g id="plant">
    <rect x="1900" y="760" width="110" height="130" rx="18" fill="#C1BA95"/>
    <path d="M1955 760c-10-90-70-140-120-150 40 50 70 100 120 150zM1955 760c10-110 60-170 120-190-30 60-60 130-120 190zM1955 760c0-80 10-150 0-210-30 60-20 140 0 210z" fill="#285D60"/>
  </g>
  <rect x="0" y="884" width="2200" height="42" fill="#CFD7D4"/>
</svg>
